[package]
name = "botgo"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.88"
authors = ["BotGo Rust contributors"]
description = "An idiomatic Rust SDK for the Tencent QQ Bot OpenAPI and gateway"
repository = "https://github.com/GukashaRe/botgo-rs"
documentation = "https://docs.rs/botgo"
readme = "README.md"
license = "Apache-2.0"
keywords = ["qq", "bot", "tencent", "sdk", "websocket"]
categories = ["api-bindings", "network-programming", "web-programming"]

[dependencies]
async-trait = "0.1.92"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "query",
    "system-proxy",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "macros",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "connect",
] }
tracing = "0.1.44"

[dev-dependencies]
wiremock = "0.6.5"

[features]
default = ["rustls-tls"]
rustls-tls = [
    "reqwest/rustls",
    "tokio-tungstenite/rustls-tls-webpki-roots",
]
native-tls = [
    "reqwest/native-tls",
    "tokio-tungstenite/native-tls",
]

[profile.dev.package.aws-lc-sys]
debug = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
